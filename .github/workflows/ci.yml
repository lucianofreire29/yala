name: Validação do YALA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar sintaxe
        run: |
          node --check app.js
          node --check catalog.mjs
          node --check server.mjs
      - name: Testar API e privacidade das conversas
        run: node --test
